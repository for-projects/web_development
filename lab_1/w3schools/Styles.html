<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:powderblue;">
    <!-- Background Color style="background-color: color;" -->

    <h1 style="background-color:red;">This is a heading</h1>
    <p style="background-color: blueviolet;"> This is a paragraph.</p>
    
    <!-- Text Color -->
    <h1 style="color:blue;">This is a heading with blue color</h1>
    <p style="color:red;">This is a paragraph with red color.</p>

    <!-- Fonts -->
     <h1 style="font-family:verdana;">This is a verdana front</h1>
    <p style="font-family:courier;">This is a courier front.</p>    

    <!-- Text Size -->
     <h1 style="font-size:300%;">This is a heading font size 300%</h1>
     <p style="font-size:160%;">This is a paragraph font size 160%.</p>

     <!-- Text Alignment -->
    <h1 style="text-align:center;">Centered Heading</h1>
    <p style="text-align:center;">Centered paragraph.</p>

    


</body>
</html>
